[project]
name = "deepagents-skills"
version = "0.1.0"
description = "pi-career-skills harness re-implemented on deepagents + langchain AgentMiddleware (thin supervisor + 4 skill subagents)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2",
    "pi-py-career-skills",
    "pydantic>=2",
    "requests>=2.31",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepagents_skills"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real LLM / network calls requiring credentials or live sites",
]
