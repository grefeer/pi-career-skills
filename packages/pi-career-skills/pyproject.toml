[project]
name = "pi-py-career-skills"
version = "0.1.0"
description = "Pi-py port of the career assistant job skills (job-discovery / job-matching / resume-tailoring / career-planning) + run-level harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pi-py-ai",
    "pi-py-agent-core",
    "pydantic>=2",
    "requests>=2.31",
    "pyyaml>=6",
]

[project.optional-dependencies]
playwright = ["playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_career_skills"]

[tool.hatch.build.targets.wheel.force-include]
"src/pi_career_skills/resources" = "pi_career_skills/resources"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: real LLM / network calls requiring credentials or live sites",
]
